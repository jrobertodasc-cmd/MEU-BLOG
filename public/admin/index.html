<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel Administrativo - Reflexões</title>
  </head>
  <body>
    <!-- Script de Configuração embutido antes do Decap CMS carregar -->
    <script>
      window.CMS_CONFIG = {
        backend: {
          name: "github",
          repo: "jrobertodasc-cmd/MEU-BLOG",
          branch: "main",
          base_url: "https://reflexoes-lac.vercel.app",
          auth_endpoint: "api/auth"
        },
        media_folder: "public/images/uploads",
        public_folder: "/images/uploads",
        site_url: "https://reflexoes-lac.vercel.app",
        display_url: "https://reflexoes-lac.vercel.app",
        collections: [
          {
            name: "posts",
            label: "Reflexões",
            label_singular: "Reflexão",
            folder: "posts",
            create: true,
            slug: "{{year}}-{{month}}-{{day}}-{{slug}}",
            fields: [
              { label: "Título", name: "title", widget: "string" },
              { label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false },
              { label: "Resumo", name: "excerpt", widget: "text", required: false },
              { label: "Corpo do Texto", name: "body", widget: "markdown" }
            ]
          }
        ]
      };
    </script>
    <!-- Inclui o Decap CMS que usará automaticamente o window.CMS_CONFIG -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
