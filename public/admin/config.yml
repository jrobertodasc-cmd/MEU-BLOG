#   branch: main

# Como a maioria dos projetos modernos Next.js vão para a Vercel, o backend do GitHub puro costuma ser melhor:
backend:
  name: github
  repo: jrobertodasc-cmd/MEU-BLOG
  branch: main
  base_url: https://reflexoes-lac.vercel.app
  auth_endpoint: api/auth

media_folder: "public/images/uploads" # Onde as imagens do post serão salvas no repositório
public_folder: "/images/uploads" # O caminho base onde as imagens serão lidas no site final

site_url: https://reflexoes-lac.vercel.app
display_url: https://reflexoes-lac.vercel.app

collections:
  - name: "posts"
    label: "Reflexões"
    label_singular: "Reflexão"
    folder: "posts"
    create: true
    format: "frontmatter"
    extension: "md"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "string" }
      - { label: "Resumo", name: "excerpt", widget: "string" }
      - { label: "Corpo do Texto", name: "body", widget: "markdown" }
